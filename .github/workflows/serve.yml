name: Archive on request

# Draws the archive pictures visitors ask for, the moment they ask: one job that reads the server's list every two
# seconds for a few hours, and the next run is started when it ends. Never on pull requests.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/serve"]

permissions:
  contents: read
  actions: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: archive-serve
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Draw what is asked for
        env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
        run: python3 arc.py --serve --loop 320
  next:
    # Starts the next run. One that ended within 15 minutes (no secrets yet, or a fault) does not start another.
    needs: serve
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          age=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          if [ "$age" -gt 900 ]; then gh workflow run serve.yml --repo "$REPO" --ref main; else echo "too short: not starting another"; fi
